# Vixen Intelligence c.2026
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "siar"
version = "0.1.0"
description = "The SIaR Framework — siar-app, siar-build and siar-db, in one install."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "LicenseRef-Proprietary"
authors = [{ name = "Vixen Intelligence", email = "rahul@vixenintelligence.com" }]

# Written by siar-dist/tools/build_release.py from what is actually published in dist/, one URL
# per platform behind mutually exclusive markers. Empty here on purpose: a checkout of this
# directory is for working on the `siar` command itself, against whatever siar-app and siar-build
# are already installed, and a placeholder URL would only be a line that resolves for nobody.
# The build refuses to produce a wheel if it cannot find this block, and checks the finished
# metadata carries both requirements — see patch_meta_pyproject and build_meta.
dependencies = [
]

[project.scripts]
# The three delegated entries are the whole point of this package. `uv tool install` exposes only
# the entry points of the distribution it was asked for, so naming siar-app, siar-build and
# siar-db here is what turns four installs into one. They are the same targets those wheels
# declare themselves, reached through the same compiled modules; nothing is wrapped or
# re-implemented.
siar = "siar.cli:main"
siar-app = "siarapp.cli.main:main"
siar-build = "siarbuild.cli:main"
siar-db = "siardb.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
